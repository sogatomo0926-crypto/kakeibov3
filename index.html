<style>
  @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800;900&display=swap');

  #kb-root {
    --paper: #212124;
    --paper-card: #2C2C30;
    --ink: #F5F5F2;
    --ink-soft: #9A9A9E;
    --red: #F0544F;
    --moss: #35B87A;
    --blue: #4F8FEA;
    --gold: #E0B064;
    --line: #333338;

    font-family: 'M PLUS Rounded 1c', 'Noto Sans JP', sans-serif;
    color: var(--ink);
    background: var(--paper);
    color-scheme: dark;
    max-width: 100%;
    margin: 0 auto;
    min-height: 100vh;
    position: relative;
    box-sizing: border-box;
    padding-bottom: 82px;
  }
  #kb-root *, #kb-root *::before, #kb-root *::after { box-sizing: border-box; }

  #kb-root .page { display: none; }
  #kb-root .page.active { display: block; }

  #kb-root .header {
    padding: 24px 20px 14px;
    border-bottom: 1px solid var(--line);
  }
  #kb-root .eyebrow { font-size: 11px; letter-spacing: 0.25em; color: var(--ink-soft); margin: 0 0 4px; }
  #kb-root .page-title { font-family: 'M PLUS Rounded 1c', sans-serif; font-weight: 900; font-size: 23px; margin: 0; letter-spacing: 0.03em; }

  /* ---- Savings page ---- */
  #kb-root .total-card {
    margin: 18px 20px 0;
    padding: 20px;
    background: var(--paper-card);
    border: 1px solid var(--line);
    border-radius: 10px;
    text-align: center;
    position: relative;
  }
  #kb-root .total-card::before {
    content: '合';
    position: absolute;
    top: -12px; left: 16px;
    width: 26px; height: 26px;
    border-radius: 50%;
    border: 2px double var(--red);
    color: var(--red);
    background: var(--paper);
    font-size: 12px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'M PLUS Rounded 1c', sans-serif;
  }
  #kb-root .total-label { font-size: 11px; letter-spacing: 0.15em; color: var(--ink-soft); margin-bottom: 6px; }
  #kb-root .total-amount { font-family: 'M PLUS Rounded 1c', sans-serif; font-weight: 900; font-size: 32px; }

  #kb-root .balance-list { margin: 16px 20px 0; display: flex; flex-direction: column; gap: 10px; }
  #kb-root .balance-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 13px 14px;
    background: var(--paper-card);
    border: 1px solid var(--line);
    border-radius: 8px;
  }
  #kb-root .balance-row .b-label { font-size: 13px; color: var(--ink-soft); display:flex; align-items:center; gap:8px; }
  #kb-root .balance-row .b-icon { font-family:'M PLUS Rounded 1c',sans-serif; font-weight:700; width:24px; height:24px; border-radius:50%; border:1.5px solid var(--gold); color: var(--gold); display:flex; align-items:center; justify-content:center; font-size:11px; flex-shrink:0; }
  #kb-root .balance-row:nth-of-type(2) .b-icon { border-color: var(--blue); color: var(--blue); }
  #kb-root .balance-row input {
    width: 130px; text-align: right;
    font-family: 'M PLUS Rounded 1c', sans-serif; font-weight: 700; font-size: 16px;
    border: none; background: none; color: var(--ink);
    padding: 4px 0;
  }
  #kb-root .balance-row input:focus { outline: none; border-bottom: 1px solid var(--gold); }

  #kb-root .section-label {
    font-size: 11px; letter-spacing: 0.2em; color: var(--ink-soft);
    padding: 22px 20px 8px;
  }

  /* ---- Credit page ---- */
  #kb-root .card-block {
    margin: 0 20px 16px;
    background: var(--paper-card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px;
  }
  #kb-root .card-block .c-name { font-family:'M PLUS Rounded 1c',sans-serif; font-weight:700; font-size:15px; margin-bottom:10px; display:flex; align-items:center; gap:8px; }
  #kb-root .card-block .c-name .dot { width:10px; height:10px; border-radius:50%; background: var(--blue); }
  #kb-root .card-block .c-name.paypay .dot { background: var(--red); }

  #kb-root .c-subhead { font-size: 10px; letter-spacing: 0.15em; color: var(--ink-soft); margin: 12px 0 6px; }
  #kb-root .c-subhead:first-of-type { margin-top: 0; }

  #kb-root .c-settings { display: flex; gap: 8px; }
  #kb-root .c-settings .c-set-field { flex: 1; }
  #kb-root .c-settings label { display:block; font-size: 10px; color: var(--ink-soft); margin-bottom: 3px; }
  #kb-root .c-settings input {
    width: 100%; padding: 7px 8px; font-size: 13px; font-family: 'M PLUS Rounded 1c', sans-serif; font-weight: 700;
    border: 1px solid var(--line); border-radius: 6px; background: var(--paper); color: var(--ink); text-align: right;
  }
  #kb-root .c-settings input:focus { outline: 2px solid var(--gold); outline-offset: 1px; }

  #kb-root .c-row { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-top: 1px solid var(--line); }
  #kb-root .c-row:first-of-type { border-top: none; }
  #kb-root .c-row .c-label { font-size: 12px; color: var(--ink-soft); }
  #kb-root .c-row .c-val { font-family:'M PLUS Rounded 1c',sans-serif; font-weight:700; font-size:15px; }
  #kb-root .c-row .c-val.negative { color: var(--red); }
  #kb-root .c-row .c-val.positive { color: var(--moss); }
  #kb-root .c-row input {
    width: 130px; text-align:right; font-family:'M PLUS Rounded 1c',sans-serif; font-weight:700; font-size:15px;
    border:none; background:none; color: var(--ink); padding: 3px 0;
  }
  #kb-root .c-row input:focus { outline:none; border-bottom: 1px solid var(--gold); }

  #kb-root .c-avail-bar { height: 7px; border-radius: 4px; background: var(--paper); border: 1px solid var(--line); overflow: hidden; margin-top: 10px; }
  #kb-root .c-avail-fill { height: 100%; background: var(--gold); }
  #kb-root .c-avail-fill.over { background: var(--red); }

  #kb-root .c-toggle-usage { margin-top: 12px; width: 100%; padding: 8px 0; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); color: var(--ink-soft); font-size: 12px; cursor: pointer; }
  #kb-root .c-usage-panel { display: none; margin-top: 10px; }
  #kb-root .c-usage-group { margin-bottom: 10px; }
  #kb-root .c-usage-group-title { font-size: 11px; color: var(--ink-soft); margin-bottom: 4px; }
  #kb-root .c-usage-item { display: flex; justify-content: space-between; font-size: 12px; padding: 5px 0; border-top: 1px solid var(--line); }
  #kb-root .c-usage-item:first-of-type { border-top: none; }
  #kb-root .c-usage-item .u-desc { color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 8px; }
  #kb-root .c-usage-item .u-amt { font-family: 'M PLUS Rounded 1c', sans-serif; font-weight: 700; flex-shrink: 0; }
  #kb-root .c-usage-empty { font-size: 12px; color: var(--ink-soft); padding: 6px 0; }

  #kb-root .credit-total {
    margin: 18px 20px 0; padding: 16px 18px;
    border: 1px dashed var(--line); border-radius: 8px;
    display: flex; justify-content: space-between; align-items: baseline;
  }
  #kb-root .credit-total .t-label { font-size: 12px; color: var(--ink-soft); letter-spacing: 0.1em; }
  #kb-root .credit-total .t-val { font-family:'M PLUS Rounded 1c',sans-serif; font-weight:900; font-size: 22px; color: var(--red); }


  /* ---- Records page ---- */
  #kb-root .date-nav {
    display: flex; align-items: center; justify-content: space-between;
    margin: 16px 20px 0; padding: 10px 14px;
    background: var(--paper-card); border: 1px solid var(--line); border-radius: 8px;
  }
  #kb-root .date-nav button {
    width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line);
    background: none; font-size: 16px; color: var(--ink); cursor: pointer;
  }
  #kb-root .date-nav input[type="date"] {
    border: none; background: none; font-family: 'M PLUS Rounded 1c', sans-serif; font-weight: 700;
    font-size: 16px; color: var(--ink); text-align: center; flex: 1;
    color-scheme: dark;
  }
  #kb-root .date-nav input[type="date"]::-webkit-calendar-picker-indicator {
    filter: invert(1) brightness(1.4);
    cursor: pointer;
  }

  #kb-root .kind-toggle {
    display: flex; margin: 14px 20px 0;
    border: 1px solid var(--line); border-radius: 20px; overflow: hidden;
  }
  #kb-root .kind-toggle button {
    flex: 1; padding: 9px 0; background: none; border: none;
    font-family: 'Noto Sans JP', sans-serif; font-size: 13px; color: var(--ink-soft); cursor: pointer;
  }
  #kb-root .kind-toggle button.active[data-kind="expense"] { background: var(--red); color: #fff; }
  #kb-root .kind-toggle button.active[data-kind="income"] { background: var(--moss); color: #fff; }
  #kb-root .kind-toggle button.active[data-kind="transfer"] { background: var(--blue); color: #fff; }

  #kb-root .field { margin: 14px 20px 0; }
  #kb-root .field label { display: block; font-size: 11px; letter-spacing: 0.1em; color: var(--ink-soft); margin-bottom: 6px; }
  #kb-root .field input[type="number"], #kb-root .field input[type="text"] {
    width: 100%; padding: 11px 12px; font-size: 15px; font-family: 'Noto Sans JP', sans-serif;
    border: 1px solid var(--line); border-radius: 6px; background: var(--paper-card); color: var(--ink);
  }
  #kb-root .field input:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
  #kb-root .amount-input { font-family: 'M PLUS Rounded 1c', sans-serif; font-weight: 700; font-size: 20px; }

  #kb-root .chip-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  #kb-root .chip {
    padding: 7px 12px; font-size: 12.5px; border: 1px solid var(--line); border-radius: 16px;
    background: var(--paper-card); color: var(--ink-soft); cursor: pointer;
  }
  #kb-root .chip.selected.expense { background: var(--red); border-color: var(--red); color: #fff; }
  #kb-root .chip.selected.income { background: var(--moss); border-color: var(--moss); color: #fff; }
  #kb-root .chip.selected.transfer { background: var(--blue); border-color: var(--blue); color: #fff; }

  #kb-root .field-label-row { display: flex; align-items: center; justify-content: space-between; }
  #kb-root .manage-link { background: none; border: none; color: var(--gold); font-size: 11px; letter-spacing: 0.05em; cursor: pointer; padding: 0; text-decoration: underline; }
  #kb-root #catManagePanel { margin-top: 10px; padding: 10px; border: 1px dashed var(--line); border-radius: 8px; background: var(--paper-card); }
  #kb-root .chip-grid.manage .chip { display: flex; align-items: center; gap: 6px; padding-right: 8px; cursor: default; }
  #kb-root .chip-grid.manage .chip .chip-del { border: none; background: none; color: var(--ink-soft); font-size: 13px; cursor: pointer; line-height: 1; padding: 0; }
  #kb-root .cat-add-row { display: flex; gap: 8px; margin-top: 10px; }
  #kb-root .cat-add-row input { flex: 1; padding: 8px 10px; font-size: 13px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); color: var(--ink); }
  #kb-root .cat-add-row button { padding: 8px 14px; border: none; border-radius: 6px; background: var(--ink); color: var(--paper); font-size: 13px; cursor: pointer; white-space: nowrap; }

  #kb-root .transfer-note { font-size: 12px; color: var(--ink-soft); padding: 8px 20px 0; }

  #kb-root .form-actions { display: flex; gap: 10px; margin: 18px 20px 0; }
  #kb-root .form-actions button { flex: 1; padding: 13px 0; border-radius: 8px; font-size: 14px; cursor: pointer; border: none; font-family: 'Noto Sans JP', sans-serif; }
  #kb-root .btn-save { background: var(--ink); color: var(--paper); font-weight: 700; }
  #kb-root .btn-cancel-edit { background: var(--paper-card); border: 1px solid var(--line) !important; color: var(--ink-soft); display: none; }

  #kb-root .filter-row { display: flex; gap: 8px; margin: 8px 20px 0; }
  #kb-root .filter-row select {
    flex: 1; padding: 8px 8px; font-size: 12px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--paper-card); color: var(--ink); font-family: 'Noto Sans JP', sans-serif;
  }

  #kb-root .ledger { margin: 12px 16px 0; background: var(--paper-card); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
  #kb-root .ledger-day { padding: 8px 14px; font-size: 11px; letter-spacing: 0.1em; color: var(--ink-soft); background: rgba(184,147,90,0.12); border-bottom: 1px solid var(--line); }
  #kb-root .entry-row { display: flex; align-items: center; gap: 8px; padding: 11px 14px; border-bottom: 1px solid var(--line); }
  #kb-root .entry-row:last-child { border-bottom: none; }
  #kb-root .entry-main { flex: 1; min-width: 0; }
  #kb-root .entry-top { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
  #kb-root .entry-tag { font-size: 10px; padding: 2px 7px; border-radius: 10px; border: 1px solid var(--line); color: var(--ink-soft); flex-shrink: 0; }
  #kb-root .entry-method { font-size: 10px; color: var(--ink-soft); }
  #kb-root .entry-memo { font-size: 12.5px; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #kb-root .entry-amt { font-family: 'M PLUS Rounded 1c', sans-serif; font-weight: 700; font-size: 14px; flex-shrink: 0; }
  #kb-root .entry-amt.expense { color: var(--red); }
  #kb-root .entry-amt.income { color: var(--moss); }
  #kb-root .entry-amt.transfer { color: var(--blue); }
  #kb-root .entry-actions { display: flex; gap: 2px; flex-shrink: 0; }
  #kb-root .entry-actions button { background: none; border: none; color: var(--ink-soft); font-size: 13px; cursor: pointer; padding: 3px 5px; }

  #kb-root .empty-state { margin: 16px 20px 0; padding: 26px 20px; text-align: center; color: var(--ink-soft); font-size: 13px; border: 1px dashed var(--line); border-radius: 4px; }

  /* ---- Bottom nav ---- */
  #kb-root .bottom-nav {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 100%;
    display: flex; background: var(--paper-card); border-top: 1px solid var(--line);
    padding: 8px 6px calc(8px + env(safe-area-inset-bottom));
    z-index: 40;
  }
  #kb-root .nav-btn {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
    background: none; border: none; padding: 6px 0; cursor: pointer;
  }
  #kb-root .nav-btn { position: relative; }
  #kb-root .nav-btn[data-page="savings"] { color: var(--red); }
  #kb-root .nav-btn[data-page="records"] { color: var(--moss); }
  #kb-root .nav-btn[data-page="credit"] { color: var(--blue); }
  #kb-root .nav-btn .n-icon { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid currentColor; display: flex; align-items: center; justify-content: center; font-size: 10px; font-family: 'M PLUS Rounded 1c', sans-serif; opacity: 0.85; transition: 0.15s; }
  #kb-root .nav-btn .n-text { font-size: 10px; letter-spacing: 0.05em; opacity: 0.85; transition: 0.15s; }
  #kb-root .nav-btn.active .n-icon { opacity: 1; border-width: 2px; }
  #kb-root .nav-btn.active .n-text { opacity: 1; font-weight: 700; }
  #kb-root .nav-btn.active::after { content: ''; position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; border-radius: 50%; background: currentColor; }

  /* ---- Notice banner ---- */
  #kb-root #noticeBanner { padding: 0; }
  #kb-root .notice-card {
    margin: 10px 20px 0; padding: 12px 14px;
    background: #FBF3E4; border: 1px solid var(--gold); border-radius: 8px;
    display: flex; align-items: flex-start; gap: 10px; font-size: 12.5px; color: var(--ink);
  }
  #kb-root .notice-card .n-body { flex: 1; }
  #kb-root .notice-card button { background: none; border: none; color: var(--ink-soft); font-size: 14px; cursor: pointer; }

  /* ---- Calendar view ---- */
  #kb-root .cal-toggle-btn {
    flex: 0 0 auto; width: 36px; padding: 0; border: 1px solid var(--line); border-radius: 6px;
    background: var(--paper-card); font-size: 14px; cursor: pointer; color: var(--ink);
    display: flex; align-items: center; justify-content: center;
  }
  #kb-root .cal-toggle-btn.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  #kb-root #calendarPanel { margin: 10px 20px 0; padding: 12px 14px; background: var(--paper-card); border: 1px solid var(--line); border-radius: 8px; }
  #kb-root .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  #kb-root .cal-nav button { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line); background: none; cursor: pointer; font-size: 14px; }
  #kb-root .cal-month-label { font-family: 'M PLUS Rounded 1c', sans-serif; font-weight: 700; font-size: 14px; }
  #kb-root .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  #kb-root .cal-wd { text-align: center; font-size: 10px; color: var(--ink-soft); padding-bottom: 4px; }
  #kb-root .cal-cell {
    aspect-ratio: 1; border: 1px solid var(--line); border-radius: 6px; background: var(--paper);
    font-size: 12px; color: var(--ink); cursor: pointer; position: relative; padding: 0;
  }
  #kb-root .cal-cell.empty { border: none; background: none; cursor: default; }
  #kb-root .cal-cell.has::after { content: ''; position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; border-radius: 50%; background: var(--red); }
  #kb-root .cal-cell.selected { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  /* ---- Revolving breakdown ---- */
  #kb-root .c-rev-panel { display: none; margin-top: 8px; padding: 10px; border: 1px dashed var(--line); border-radius: 6px; }
  #kb-root .c-rev-item { display: flex; align-items: center; gap: 8px; font-size: 12px; padding: 5px 0; border-top: 1px solid var(--line); }
  #kb-root .c-rev-item:first-child { border-top: none; }
  #kb-root .c-rev-item .r-label { flex: 1; color: var(--ink-soft); }
  #kb-root .c-rev-item .r-amt { font-family: 'M PLUS Rounded 1c', sans-serif; font-weight: 700; }
  #kb-root .c-rev-item button { background: none; border: none; color: var(--ink-soft); font-size: 13px; cursor: pointer; }
  #kb-root .c-rev-add { display: flex; gap: 6px; margin-top: 8px; }
  #kb-root .c-rev-add input { border: 1px solid var(--line); border-radius: 6px; background: var(--paper); padding: 6px 8px; font-size: 12px; color: var(--ink); }
  #kb-root .c-rev-add input[data-revlabel] { flex: 1.4; min-width: 0; }
  #kb-root .c-rev-add input[data-revamount] { flex: 1; min-width: 0; }
  #kb-root .c-rev-add button { padding: 6px 10px; border: none; border-radius: 6px; background: var(--ink); color: var(--paper); font-size: 12px; cursor: pointer; }
  #kb-root .pay-countdown { font-size: 10px; color: var(--ink-soft); margin-top: 4px; }
  #kb-root .pay-countdown.soon { color: var(--red); }
</style>

<div id="kb-root">
  <div id="noticeBanner"></div>

  <!-- ================= SAVINGS PAGE ================= -->
  <div class="page active" id="page-savings">
    <div class="header">
      <p class="eyebrow">家計簿</p>
      <h1 class="page-title">貯金額</h1>
    </div>

    <div class="total-card">
      <div class="total-label">合計</div>
      <div class="total-amount" id="totalAmount">¥0</div>
    </div>

    <div class="balance-list">
      <div class="balance-row">
        <span class="b-label"><span class="b-icon">財</span>財布（現金）</span>
        <input type="number" id="walletInput" inputmode="numeric" />
      </div>
      <div class="balance-row">
        <span class="b-label"><span class="b-icon">口</span>口座</span>
        <input type="number" id="accountInput" inputmode="numeric" />
      </div>
    </div>
  </div>

  <!-- ================= CREDIT PAGE ================= -->
  <div class="page" id="page-credit">
    <div class="header">
      <p class="eyebrow">家計簿</p>
      <h1 class="page-title">クレカ</h1>
    </div>

    <div class="credit-total">
      <span class="t-label">未払い合計（今月・来月・分割リボ）</span>
      <span class="t-val" id="creditTotal">¥0</span>
    </div>

    <p class="section-label">カード別の内訳</p>
    <div id="cardBlocks"></div>
  </div>

  <!-- ================= RECORDS PAGE ================= -->
  <div class="page" id="page-records">
    <div class="header">
      <p class="eyebrow">家計簿</p>
      <h1 class="page-title" id="recordsTitle">記録</h1>
    </div>

    <div class="date-nav">
      <button id="prevDay">‹</button>
      <input type="date" id="entryDate" />
      <button id="nextDay">›</button>
    </div>

    <div class="kind-toggle">
      <button type="button" class="active" data-kind="expense">支出</button>
      <button type="button" data-kind="income">収入</button>
      <button type="button" data-kind="transfer">移動</button>
    </div>

    <div class="field" id="categoryField">
      <label class="field-label-row">カテゴリ<button type="button" id="manageCatBtn" class="manage-link">編集</button></label>
      <div class="chip-grid" id="categoryChips"></div>
      <div id="catManagePanel" style="display:none;">
        <div class="chip-grid manage" id="catManageChips"></div>
        <div class="cat-add-row">
          <input type="text" id="newCatInput" placeholder="新しいカテゴリ名" />
          <button type="button" id="addCatBtn">追加</button>
        </div>
      </div>
    </div>

    <div class="field" id="methodField">
      <label id="methodLabel">支払い方法</label>
      <div class="chip-grid" id="methodChips"></div>
    </div>

    <p class="transfer-note" id="transferNote" style="display:none;">口座と財布のあいだで金額を移動します（合計残高は変わりません）。</p>

    <div class="field">
      <label>金額</label>
      <input type="number" id="fAmount" class="amount-input" inputmode="numeric" placeholder="0" min="0" />
    </div>

    <div class="field">
      <label>メモ（カテゴリより詳しく・後で見返す用）</label>
      <input type="text" id="fMemo" placeholder="例）駅前スーパーで夕食の食材" />
    </div>

    <div class="form-actions">
      <button class="btn-cancel-edit" id="cancelEdit">編集をやめる</button>
      <button class="btn-save" id="saveEntry">記録する</button>
    </div>

    <p class="section-label">記録履歴</p>
    <div class="filter-row">
      <select id="filterPeriod">
        <option value="today">今日</option>
        <option value="month" selected>今月</option>
        <option value="lastmonth">先月</option>
        <option value="all">すべて</option>
      </select>
      <select id="filterCategory"><option value="all">カテゴリ：すべて</option></select>
      <select id="filterMethod"><option value="all">方法：すべて</option></select>
      <button type="button" id="calToggleBtn" class="cal-toggle-btn" aria-label="カレンダー表示">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
      </button>
    </div>

    <div id="calendarPanel" style="display:none;"></div>
    <div id="historyContainer"></div>
  </div>

  <!-- ================= BOTTOM NAV ================= -->
  <div class="bottom-nav">
    <button class="nav-btn active" data-page="savings">
      <span class="n-icon">貯</span><span class="n-text">貯金</span>
    </button>
    <button class="nav-btn" data-page="records">
      <span class="n-icon">記</span><span class="n-text">記録</span>
    </button>
    <button class="nav-btn" data-page="credit">
      <span class="n-icon">ク</span><span class="n-text">クレカ</span>
    </button>
  </div>
</div>

<script>
(function () {
  const DEFAULT_EXPENSE_CATS = ["食費","日用品","交通費","娯楽","家賃","光熱費","通信費","医療","その他"];
  const DEFAULT_INCOME_CATS = ["給与","副業","お小遣い","その他"];
  const EXPENSE_METHODS = [
    {v:'cash', l:'現金'}, {v:'jcb', l:'クレカ(JCB)'}, {v:'paypay', l:'クレカ(PayPay)'}, {v:'account', l:'口座'}
  ];
  const INCOME_METHODS = [
    {v:'wallet', l:'財布へ'}, {v:'account', l:'口座へ'}
  ];
  const TRANSFER_METHODS = [
    {v:'account_to_wallet', l:'口座→財布'}, {v:'wallet_to_account', l:'財布→口座'}
  ];

  let state = {
    wallet: 0, account: 0,
    cards: {
      jcb: { name: 'JCB', closingDay: 15, paymentDay: 10, limit: 0, revolvingItems: [], lastPaidCycle: null },
      paypay: { name: 'PayPayカード', closingDay: 31, paymentDay: 27, limit: 0, revolvingItems: [], lastPaidCycle: null }
    },
    categories: { expense: [...DEFAULT_EXPENSE_CATS], income: [...DEFAULT_INCOME_CATS] }
  };
  let entries = [];
  let currentKind = 'expense';
  let selectedCategory = DEFAULT_EXPENSE_CATS[0];
  let catManageOpen = false;

  function currentCatList() {
    return currentKind === 'expense' ? state.categories.expense : state.categories.income;
  }
  let selectedMethod = EXPENSE_METHODS[0].v;
  let editingId = null;

  const $ = (id) => document.getElementById(id);

  function fmtYen(n) { return '¥' + Math.round(n||0).toLocaleString('ja-JP'); }
  function pad(n) { return String(n).padStart(2,'0'); }
  function todayStr() { const d = new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function escapeHtml(s) { return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  async function loadAll() {
    try {
      const [sRes, eRes] = await Promise.all([
        window.storage.get('kb_state', false).catch(()=>null),
        window.storage.get('kb_entries', false).catch(()=>null)
      ]);
      if (sRes && sRes.value) {
        const saved = JSON.parse(sRes.value);
        state = Object.assign(state, saved);
        // Merge card settings so older saves (without closingDay/paymentDay/limit/revolvingItems) get sane defaults.
        const defaults = {
          jcb: { name: 'JCB', closingDay: 15, paymentDay: 10, limit: 0, revolvingItems: [], lastPaidCycle: null },
          paypay: { name: 'PayPayカード', closingDay: 31, paymentDay: 27, limit: 0, revolvingItems: [], lastPaidCycle: null }
        };
        const mergedCards = {};
        Object.keys(defaults).forEach(k => {
          const savedCard = (saved.cards && saved.cards[k]) || {};
          const merged = Object.assign({}, defaults[k], savedCard);
          delete merged.billing; // old field, no longer used
          if (!Array.isArray(merged.revolvingItems)) merged.revolvingItems = [];
          // Migrate an old single "revolving" total into one breakdown item.
          if (typeof savedCard.revolving === 'number' && savedCard.revolving > 0 && merged.revolvingItems.length === 0) {
            merged.revolvingItems = [{ id: 'legacy-' + k, label: '合計', amount: savedCard.revolving }];
          }
          delete merged.revolving;
          mergedCards[k] = merged;
        });
        state.cards = mergedCards;
      }
      if (eRes && eRes.value) entries = JSON.parse(eRes.value);
    } catch (e) { /* first run, no data yet */ }
    $('entryDate').value = todayStr();
    const notices = await processAutoPayments();
    renderSavings();
    renderCredit();
    renderForm();
    populateFilterOptions();
    renderHistory();
    renderNotices(notices);
  }

  function renderNotices(messages) {
    if (!messages || messages.length === 0) return;
    $('noticeBanner').innerHTML = messages.map((m, i) =>
      `<div class="notice-card"><span class="n-body">${escapeHtml(m)}</span><button type="button" data-noticeclose="${i}" aria-label="閉じる">×</button></div>`
    ).join('');
    $('noticeBanner').querySelectorAll('[data-noticeclose]').forEach(btn => {
      btn.addEventListener('click', () => btn.closest('.notice-card').remove());
    });
  }

  async function saveState() {
    try { await window.storage.set('kb_state', JSON.stringify(state), false); } catch (e) { console.error(e); }
  }
  async function saveEntries() {
    try { await window.storage.set('kb_entries', JSON.stringify(entries), false); } catch (e) { console.error(e); }
  }

  /* ---------- Page nav ---------- */
  const PAGE_ORDER = ['savings', 'records', 'credit'];
  let currentPage = 'savings';

  function switchPage(key) {
    if (!PAGE_ORDER.includes(key)) return;
    currentPage = key;
    document.querySelectorAll('#kb-root .nav-btn').forEach(b => b.classList.toggle('active', b.dataset.page === key));
    document.querySelectorAll('#kb-root .page').forEach(p => p.classList.toggle('active', p.id === 'page-' + key));
  }

  document.querySelectorAll('#kb-root .nav-btn').forEach(btn => {
    btn.addEventListener('click', () => switchPage(btn.dataset.page));
  });

  /* ---------- Swipe between pages ---------- */
  (function setupSwipe() {
    let startX = 0, startY = 0, tracking = false;
    const root = document.getElementById('kb-root');
    root.addEventListener('touchstart', (e) => {
      if (e.touches.length !== 1) return;
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      tracking = true;
    }, { passive: true });
    root.addEventListener('touchend', (e) => {
      if (!tracking) return;
      tracking = false;
      const dx = e.changedTouches[0].clientX - startX;
      const dy = e.changedTouches[0].clientY - startY;
      if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.4) return;
      const idx = PAGE_ORDER.indexOf(currentPage);
      const nextIdx = dx < 0 ? idx + 1 : idx - 1;
      if (nextIdx >= 0 && nextIdx < PAGE_ORDER.length) switchPage(PAGE_ORDER[nextIdx]);
    }, { passive: true });
  })();

  /* ---------- Savings page ---------- */
  function renderSavings() {
    $('walletInput').value = state.wallet;
    $('accountInput').value = state.account;
    $('totalAmount').textContent = fmtYen(state.wallet + state.account);
  }
  $('walletInput').addEventListener('change', () => {
    state.wallet = parseFloat($('walletInput').value) || 0;
    saveState(); renderSavings();
  });
  $('accountInput').addEventListener('change', () => {
    state.account = parseFloat($('accountInput').value) || 0;
    saveState(); renderSavings();
  });

  /* ---------- Credit page ---------- */
  function fmtMD(d) { return (d.getMonth()+1) + '/' + d.getDate(); }

  function cardBlockHtml(key, card) {
    const stats = cardStats(key, card);
    const overLimit = stats.available < 0;
    const usedRatio = stats.limit > 0 ? Math.min(100, Math.max(0, (stats.totalUnpaid / stats.limit) * 100)) : 0;
    const dotClass = key === 'paypay' ? ' paypay' : '';

    function usageGroupHtml(title, list) {
      if (list.length === 0) return `<div class="c-usage-group"><div class="c-usage-group-title">${title}</div><div class="c-usage-empty">利用はありません</div></div>`;
      const rows = list.map(e => `<div class="c-usage-item"><span class="u-desc">${e.date.slice(5).replace('-','/')} ${escapeHtml(e.category)}${e.memo ? ' ・ '+escapeHtml(e.memo) : ''}</span><span class="u-amt">${fmtYen(e.amount)}</span></div>`).join('');
      return `<div class="c-usage-group"><div class="c-usage-group-title">${title}</div>${rows}</div>`;
    }

    return `
      <div class="card-block" data-card="${key}">
        <div class="c-name${dotClass}"><span class="dot"></span>${escapeHtml(card.name)}</div>

        <div class="c-subhead">カード設定</div>
        <div class="c-settings">
          <div class="c-set-field">
            <label>締め日</label>
            <input type="number" min="1" max="31" data-field="closingDay" data-card="${key}" value="${card.closingDay}" />
          </div>
          <div class="c-set-field">
            <label>引き落とし日</label>
            <input type="number" min="1" max="31" data-field="paymentDay" data-card="${key}" value="${card.paymentDay}" />
          </div>
          <div class="c-set-field">
            <label>限度額</label>
            <input type="number" min="0" data-field="limit" data-card="${key}" value="${card.limit}" />
          </div>
        </div>
        <div class="pay-countdown${stats.daysUntilPay <= 3 ? ' soon' : ''}">
          次回引き落とし：${fmtMD(stats.payDate)}（あと${stats.daysUntilPay}日）${stats.paidThisCycle ? '・今月分は自動記録済み' : ''}
        </div>

        <div class="c-subhead">請求状況</div>
        <div class="c-row"><span class="c-label">今月のご請求額（${fmtMD(stats.winThis.startDate)}〜${fmtMD(stats.winThis.endDate)}分）</span><span class="c-val">${fmtYen(stats.thisMonthBilling)}</span></div>
        <div class="c-row"><span class="c-label">来月のご請求額（${fmtMD(stats.winNext.startDate)}〜${fmtMD(stats.winNext.endDate)}分・集計中）</span><span class="c-val">${fmtYen(stats.nextMonthBilling)}</span></div>
        <div class="c-row">
          <span class="c-label">分割・リボ払い残高<button type="button" class="manage-link" data-revtoggle="${key}">内訳</button></span>
          <span class="c-val">${fmtYen(stats.revolving)}</span>
        </div>
        <div class="c-rev-panel" id="revpanel-${key}">
          ${(card.revolvingItems && card.revolvingItems.length) ? card.revolvingItems.map(it => `
            <div class="c-rev-item">
              <span class="r-label">${escapeHtml(it.label)}</span>
              <span class="r-amt">${fmtYen(it.amount)}</span>
              <button type="button" data-revdel="${it.id}" data-card="${key}" aria-label="削除">×</button>
            </div>`).join('') : '<div class="c-usage-empty">内訳はまだありません</div>'}
          <div class="c-rev-add">
            <input type="text" placeholder="例）8月分" data-revlabel="${key}" />
            <input type="number" placeholder="金額" data-revamount="${key}" />
            <button type="button" data-revadd="${key}">追加</button>
          </div>
        </div>
        <div class="c-row"><span class="c-label">トータル未払い額</span><span class="c-val negative">${fmtYen(stats.totalUnpaid)}</span></div>
        <div class="c-row"><span class="c-label">限度額</span><span class="c-val">${fmtYen(stats.limit)}</span></div>
        <div class="c-row"><span class="c-label">残り利用可能額</span><span class="c-val${overLimit?' negative':' positive'}">${fmtYen(stats.available)}</span></div>
        <div class="c-avail-bar"><div class="c-avail-fill${overLimit?' over':''}" style="width:${usedRatio}%"></div></div>

        <button type="button" class="c-toggle-usage" data-toggle="${key}">利用状況を見る</button>
        <div class="c-usage-panel" id="usage-${key}">
          ${usageGroupHtml('来月請求予定分（' + fmtMD(stats.winNext.startDate) + '〜' + fmtMD(stats.winNext.endDate) + '）', stats.nextList)}
          ${usageGroupHtml('今月請求分（' + fmtMD(stats.winThis.startDate) + '〜' + fmtMD(stats.winThis.endDate) + '）', stats.thisList)}
        </div>
      </div>`;
  }

  let openUsagePanels = new Set();
  let openRevPanels = new Set();

  function renderCredit() {
    const keys = Object.keys(state.cards);
    $('cardBlocks').innerHTML = keys.map(k => cardBlockHtml(k, state.cards[k])).join('');

    let total = 0;
    keys.forEach(k => { total += cardStats(k, state.cards[k]).totalUnpaid; });
    $('creditTotal').textContent = fmtYen(total);

    $('cardBlocks').querySelectorAll('input[data-field]').forEach(inp => {
      inp.addEventListener('change', () => {
        const key = inp.dataset.card, field = inp.dataset.field;
        state.cards[key][field] = parseFloat(inp.value) || 0;
        saveState();
        renderCredit();
      });
    });

    $('cardBlocks').querySelectorAll('[data-toggle]').forEach(btn => {
      const key = btn.dataset.toggle;
      const panel = $('usage-' + key);
      if (openUsagePanels.has(key)) { panel.style.display = 'block'; btn.textContent = '利用状況を閉じる'; }
      btn.addEventListener('click', () => {
        const open = panel.style.display === 'block';
        panel.style.display = open ? 'none' : 'block';
        btn.textContent = open ? '利用状況を見る' : '利用状況を閉じる';
        if (open) openUsagePanels.delete(key); else openUsagePanels.add(key);
      });
    });

    $('cardBlocks').querySelectorAll('[data-revtoggle]').forEach(btn => {
      const key = btn.dataset.revtoggle;
      const panel = $('revpanel-' + key);
      if (openRevPanels.has(key)) panel.style.display = 'block';
      btn.addEventListener('click', () => {
        const open = panel.style.display === 'block';
        panel.style.display = open ? 'none' : 'block';
        if (open) openRevPanels.delete(key); else openRevPanels.add(key);
      });
    });

    $('cardBlocks').querySelectorAll('[data-revdel]').forEach(btn => {
      btn.addEventListener('click', () => {
        const key = btn.dataset.card;
        const id = btn.dataset.revdel;
        state.cards[key].revolvingItems = (state.cards[key].revolvingItems || []).filter(it => it.id !== id);
        openRevPanels.add(key);
        saveState();
        renderCredit();
      });
    });

    $('cardBlocks').querySelectorAll('[data-revadd]').forEach(btn => {
      btn.addEventListener('click', () => {
        const key = btn.dataset.revadd;
        const labelInp = $('cardBlocks').querySelector(`input[data-revlabel="${key}"]`);
        const amountInp = $('cardBlocks').querySelector(`input[data-revamount="${key}"]`);
        const label = (labelInp.value || '').trim() || '内訳';
        const amount = parseFloat(amountInp.value);
        if (!amount || amount <= 0) { amountInp.focus(); return; }
        state.cards[key].revolvingItems = state.cards[key].revolvingItems || [];
        state.cards[key].revolvingItems.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2,5), label, amount });
        openRevPanels.add(key);
        saveState();
        renderCredit();
      });
    });
  }


  /* ---------- Records: date nav ---------- */
  $('prevDay').addEventListener('click', () => shiftDate(-1));
  $('nextDay').addEventListener('click', () => shiftDate(1));
  function shiftDate(delta) {
    const d = new Date($('entryDate').value + 'T00:00:00');
    d.setDate(d.getDate() + delta);
    $('entryDate').value = d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  }

  /* ---------- Records: kind toggle ---------- */
  document.querySelectorAll('#kb-root .kind-toggle button').forEach(btn => {
    btn.addEventListener('click', () => {
      currentKind = btn.dataset.kind;
      document.querySelectorAll('#kb-root .kind-toggle button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedCategory = currentKind === 'transfer' ? null : (currentCatList()[0] || null);
      selectedMethod = currentKind === 'expense' ? EXPENSE_METHODS[0].v : (currentKind === 'income' ? INCOME_METHODS[0].v : TRANSFER_METHODS[0].v);
      catManageOpen = false;
      $('catManagePanel').style.display = 'none';
      renderForm();
    });
  });

  function renderForm() {
    const catField = $('categoryField');
    const methodField = $('methodField');
    const transferNote = $('transferNote');

    if (currentKind === 'transfer') {
      catField.style.display = 'none';
      transferNote.style.display = 'block';
      $('methodLabel').textContent = '移動の方向';
      $('methodChips').innerHTML = TRANSFER_METHODS.map(m =>
        `<button type="button" class="chip transfer ${m.v===selectedMethod?'selected':''}" data-method="${m.v}">${m.l}</button>`
      ).join('');
    } else {
      catField.style.display = 'block';
      transferNote.style.display = 'none';
      let cats = currentCatList();
      if (selectedCategory && !cats.includes(selectedCategory)) {
        cats = [...cats, selectedCategory]; // keep a deleted-but-still-referenced category visible while editing
      } else if (!selectedCategory) {
        selectedCategory = cats[0] || null;
      }
      $('categoryChips').innerHTML = cats.map(c =>
        `<button type="button" class="chip ${currentKind} ${c===selectedCategory?'selected':''}" data-cat="${c}">${c}</button>`
      ).join('');
      $('methodLabel').textContent = currentKind === 'expense' ? '支払い方法' : '入金先';
      const methods = currentKind === 'expense' ? EXPENSE_METHODS : INCOME_METHODS;
      $('methodChips').innerHTML = methods.map(m =>
        `<button type="button" class="chip ${currentKind} ${m.v===selectedMethod?'selected':''}" data-method="${m.v}">${m.l}</button>`
      ).join('');
      $('categoryChips').querySelectorAll('.chip').forEach(chip => {
        chip.addEventListener('click', () => {
          selectedCategory = chip.dataset.cat;
          $('categoryChips').querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
          chip.classList.add('selected');
        });
      });
      renderCatManage();
    }
    $('methodChips').querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        selectedMethod = chip.dataset.method;
        $('methodChips').querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
        chip.classList.add('selected');
      });
    });
  }

  function renderCatManage() {
    const cats = currentCatList();
    $('catManageChips').innerHTML = cats.map(c =>
      `<span class="chip ${currentKind}">${escapeHtml(c)}<button type="button" class="chip-del" data-delcat="${escapeHtml(c)}" aria-label="削除">×</button></span>`
    ).join('');
    $('catManageChips').querySelectorAll('[data-delcat]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const list = currentCatList();
        if (list.length <= 1) return; // keep at least one category
        const name = btn.dataset.delcat;
        const idx = list.indexOf(name);
        if (idx !== -1) list.splice(idx, 1);
        await saveState();
        renderForm();
        populateFilterOptions();
      });
    });
  }

  $('manageCatBtn').addEventListener('click', () => {
    catManageOpen = !catManageOpen;
    $('catManagePanel').style.display = catManageOpen ? 'block' : 'none';
    if (catManageOpen) renderCatManage();
  });

  $('addCatBtn').addEventListener('click', async () => {
    const input = $('newCatInput');
    const name = input.value.trim();
    if (!name) { input.focus(); return; }
    const list = currentCatList();
    if (list.includes(name)) { input.value = ''; return; }
    list.push(name);
    selectedCategory = name;
    await saveState();
    input.value = '';
    renderForm();
    populateFilterOptions();
  });
  $('newCatInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); $('addCatBtn').click(); }
  });

  /* ---------- Balance effect ---------- */
  function applyEffect(entry, sign) {
    const amt = entry.amount * sign;
    if (entry.kind === 'expense') {
      if (entry.method === 'cash') state.wallet -= amt;
      else if (entry.method === 'account') state.account -= amt;
      // card methods (jcb / paypay) are not deducted here — their billing
      // amounts are calculated live from the expense records instead.
    } else if (entry.kind === 'income') {
      if (entry.method === 'wallet') state.wallet += amt;
      else if (entry.method === 'account') state.account += amt;
    } else if (entry.kind === 'transfer') {
      if (entry.method === 'account_to_wallet') { state.account -= amt; state.wallet += amt; }
      else if (entry.method === 'wallet_to_account') { state.wallet -= amt; state.account += amt; }
    }
  }

  /* ---------- Credit card statement calculation ---------- */
  function daysInMonth(year, month1) { return new Date(year, month1, 0).getDate(); }
  function addMonths(year, month1, delta) {
    const d = new Date(year, month1 - 1 + delta, 1);
    return { year: d.getFullYear(), month: d.getMonth() + 1 };
  }
  function closingDateObj(card, year, month1) {
    const dim = daysInMonth(year, month1);
    const day = Math.min(card.closingDay || dim, dim);
    return new Date(year, month1 - 1, day);
  }
  // The statement that gets paid in (payYear, payMonth1) closes the month before,
  // and covers the day after the previous closing date through this closing date.
  function statementWindow(card, payYear, payMonth1) {
    const cm = addMonths(payYear, payMonth1, -1);
    const endDate = closingDateObj(card, cm.year, cm.month);
    const pm = addMonths(cm.year, cm.month, -1);
    const prevClose = closingDateObj(card, pm.year, pm.month);
    const startDate = new Date(prevClose);
    startDate.setDate(startDate.getDate() + 1);
    return { startDate, endDate };
  }
  function entriesInWindow(methodKey, win) {
    const startStr = dateToStr(win.startDate), endStr = dateToStr(win.endDate);
    return entries.filter(e => e.kind === 'expense' && e.method === methodKey && e.date >= startStr && e.date <= endStr)
      .sort((a,b) => b.date.localeCompare(a.date));
  }
  function dateToStr(d) { return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }

  function cardStats(methodKey, card) {
    const now = new Date();
    const cy = now.getFullYear(), cmo = now.getMonth() + 1;
    const winThis = statementWindow(card, cy, cmo);
    const nextPay = addMonths(cy, cmo, 1);
    const winNext = statementWindow(card, nextPay.year, nextPay.month);
    const thisList = entriesInWindow(methodKey, winThis);
    const nextList = entriesInWindow(methodKey, winNext);
    const thisMonthBilling = thisList.reduce((s,e)=>s+e.amount, 0);
    const nextMonthBilling = nextList.reduce((s,e)=>s+e.amount, 0);
    const revolving = (card.revolvingItems || []).reduce((s,it)=>s+it.amount, 0);
    const totalUnpaid = thisMonthBilling + nextMonthBilling + revolving;
    const limit = card.limit || 0;
    const available = limit - totalUnpaid;

    const dim = daysInMonth(cy, cmo);
    const payDay = Math.min(card.paymentDay || dim, dim);
    let payDate = new Date(cy, cmo - 1, payDay);
    if (payDate < new Date(now.getFullYear(), now.getMonth(), now.getDate())) {
      const nm = addMonths(cy, cmo, 1);
      const dim2 = daysInMonth(nm.year, nm.month);
      payDate = new Date(nm.year, nm.month - 1, Math.min(card.paymentDay || dim2, dim2));
    }
    const daysUntilPay = Math.round((payDate - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 86400000);
    const currentCycleKey = cy + '-' + pad(cmo);
    const paidThisCycle = card.lastPaidCycle === currentCycleKey;

    return { thisMonthBilling, nextMonthBilling, revolving, totalUnpaid, limit, available, winThis, winNext, thisList, nextList, payDate, daysUntilPay, paidThisCycle };
  }

  /* ---------- Automatic payment deduction ---------- */
  async function processAutoPayments() {
    const now = new Date();
    const cy = now.getFullYear(), cmo = now.getMonth() + 1;
    const todayNoTime = new Date(cy, cmo - 1, now.getDate());
    const cycleKey = cy + '-' + pad(cmo);
    let changed = false;
    const notices = [];

    for (const key of Object.keys(state.cards)) {
      const card = state.cards[key];
      const dim = daysInMonth(cy, cmo);
      const payDay = Math.min(card.paymentDay || dim, dim);
      const payDate = new Date(cy, cmo - 1, payDay);
      if (todayNoTime >= payDate && card.lastPaidCycle !== cycleKey) {
        const win = statementWindow(card, cy, cmo);
        const list = entriesInWindow(key, win);
        const amount = list.reduce((s,e)=>s+e.amount, 0);
        if (amount > 0) {
          state.account -= amount;
          entries.push({
            id: Date.now().toString(36) + Math.random().toString(36).slice(2,7) + key,
            kind: 'expense', category: 'カード引き落とし', method: 'account', amount,
            memo: card.name + ' 利用分の自動引き落とし', date: dateToStr(payDate)
          });
          notices.push(card.name + 'の引き落とし ' + fmtYen(amount) + ' を口座から自動で記録しました。');
        }
        card.lastPaidCycle = cycleKey;
        changed = true;
      }
    }
    if (changed) { await saveState(); await saveEntries(); }
    return notices;
  }

  function methodLabelOf(entry) {
    if (entry.kind === 'expense') return EXPENSE_METHODS.find(m=>m.v===entry.method)?.l || entry.method;
    if (entry.kind === 'income') return (INCOME_METHODS.find(m=>m.v===entry.method)?.l || entry.method);
    return TRANSFER_METHODS.find(m=>m.v===entry.method)?.l || entry.method;
  }

  /* ---------- Save / update entry ---------- */
  $('saveEntry').addEventListener('click', async () => {
    const amount = parseFloat($('fAmount').value);
    if (!amount || amount <= 0) { $('fAmount').focus(); return; }
    const date = $('entryDate').value || todayStr();
    const memo = $('fMemo').value.trim();
    const category = currentKind === 'transfer' ? '資金移動' : selectedCategory;

    if (editingId) {
      const idx = entries.findIndex(e => e.id === editingId);
      if (idx !== -1) {
        applyEffect(entries[idx], -1); // reverse old effect
        entries[idx] = { ...entries[idx], kind: currentKind, category, method: selectedMethod, amount, memo, date };
        applyEffect(entries[idx], 1);
      }
      editingId = null;
      $('cancelEdit').style.display = 'none';
      $('saveEntry').textContent = '記録する';
    } else {
      const entry = {
        id: Date.now().toString(36) + Math.random().toString(36).slice(2,7),
        kind: currentKind, category, method: selectedMethod, amount, memo, date
      };
      applyEffect(entry, 1);
      entries.push(entry);
    }

    await saveState();
    await saveEntries();
    $('fAmount').value = '';
    $('fMemo').value = '';
    renderSavings();
    renderCredit();
    renderHistory();
  });

  $('cancelEdit').addEventListener('click', () => {
    editingId = null;
    $('cancelEdit').style.display = 'none';
    $('saveEntry').textContent = '記録する';
    $('fAmount').value = '';
    $('fMemo').value = '';
  });

  function startEdit(id) {
    const entry = entries.find(e => e.id === id);
    if (!entry) return;
    switchPage('records');

    currentKind = entry.kind;
    document.querySelectorAll('#kb-root .kind-toggle button').forEach(b => b.classList.toggle('active', b.dataset.kind === entry.kind));
    selectedCategory = entry.kind === 'transfer' ? null : entry.category;
    selectedMethod = entry.method;
    renderForm();

    $('entryDate').value = entry.date;
    $('fAmount').value = entry.amount;
    $('fMemo').value = entry.memo || '';
    editingId = id;
    $('cancelEdit').style.display = 'block';
    $('saveEntry').textContent = '更新する';
    window.scrollTo({top:0, behavior:'smooth'});
  }

  async function deleteEntry(id) {
    const idx = entries.findIndex(e => e.id === id);
    if (idx === -1) return;
    applyEffect(entries[idx], -1);
    entries.splice(idx, 1);
    await saveState();
    await saveEntries();
    renderSavings();
    renderCredit();
    renderHistory();
  }

  /* ---------- History + filters ---------- */
  let calMode = false;
  let calYear, calMonth, calSelectedDate = null;

  function populateFilterOptions() {
    const catSel = $('filterCategory');
    const prevVal = catSel.value || 'all';
    const allCats = [...state.categories.expense, ...state.categories.income, '資金移動', ...entries.map(e => e.category)];
    const uniqueCats = [...new Set(allCats)];
    catSel.innerHTML = '<option value="all">カテゴリ：すべて</option>' + uniqueCats.map(c => `<option value="${c}">${c}</option>`).join('');
    if ([...catSel.options].some(o => o.value === prevVal)) catSel.value = prevVal;

    const methodSel = $('filterMethod');
    const allMethods = [...EXPENSE_METHODS, ...INCOME_METHODS, ...TRANSFER_METHODS];
    const seen = new Set();
    let opts = '<option value="all">方法：すべて</option>';
    allMethods.forEach(m => { if (!seen.has(m.v+m.l)) { seen.add(m.v+m.l); opts += `<option value="${m.l}">${m.l}</option>`; } });
    methodSel.innerHTML = opts;
  }

  ['filterPeriod','filterCategory','filterMethod'].forEach(id => $(id).addEventListener('change', renderHistory));

  $('calToggleBtn').addEventListener('click', () => {
    calMode = !calMode;
    $('calToggleBtn').classList.toggle('on', calMode);
    $('calendarPanel').style.display = calMode ? 'block' : 'none';
    if (calMode) {
      const now = new Date();
      calYear = now.getFullYear(); calMonth = now.getMonth() + 1;
      calSelectedDate = null;
      renderCalendar();
    }
    renderHistory();
  });

  function renderCalendar() {
    const dim = daysInMonth(calYear, calMonth);
    const firstDow = new Date(calYear, calMonth - 1, 1).getDay();
    const monthKey = calYear + '-' + pad(calMonth);
    const daysWithEntries = new Set(entries.filter(e => e.date.slice(0,7) === monthKey).map(e => e.date));

    let cells = '';
    for (let i = 0; i < firstDow; i++) cells += '<div class="cal-cell empty"></div>';
    for (let d = 1; d <= dim; d++) {
      const dateStr = calYear + '-' + pad(calMonth) + '-' + pad(d);
      const has = daysWithEntries.has(dateStr);
      const sel = calSelectedDate === dateStr;
      cells += `<button type="button" class="cal-cell${has?' has':''}${sel?' selected':''}" data-date="${dateStr}">${d}</button>`;
    }

    $('calendarPanel').innerHTML = `
      <div class="cal-nav">
        <button type="button" id="calPrevMonth">‹</button>
        <span class="cal-month-label">${calYear}年${calMonth}月</span>
        <button type="button" id="calNextMonth">›</button>
      </div>
      <div class="cal-grid cal-weekdays">${['日','月','火','水','木','金','土'].map(w=>`<div class="cal-wd">${w}</div>`).join('')}</div>
      <div class="cal-grid">${cells}</div>
    `;
    $('calPrevMonth').addEventListener('click', () => { const m = addMonths(calYear, calMonth, -1); calYear = m.year; calMonth = m.month; renderCalendar(); });
    $('calNextMonth').addEventListener('click', () => { const m = addMonths(calYear, calMonth, 1); calYear = m.year; calMonth = m.month; renderCalendar(); });
    $('calendarPanel').querySelectorAll('[data-date]').forEach(btn => {
      btn.addEventListener('click', () => {
        calSelectedDate = calSelectedDate === btn.dataset.date ? null : btn.dataset.date;
        renderCalendar();
        renderHistory();
      });
    });
  }

  function renderEntryList(list) {
    const container = $('historyContainer');
    if (list.length === 0) {
      container.innerHTML = '<div class="empty-state">条件に合う記録がありません。</div>';
      return;
    }
    const byDay = {};
    list.forEach(e => { (byDay[e.date] = byDay[e.date] || []).push(e); });
    const days = Object.keys(byDay).sort((a,b) => b.localeCompare(a));

    container.innerHTML = days.map(day => {
      const dayEntries = byDay[day].slice().sort((a,b) => b.id.localeCompare(a.id));
      const d = new Date(day + 'T00:00:00');
      const weekday = ['日','月','火','水','木','金','土'][d.getDay()];
      const rows = dayEntries.map(e => {
        const sign = e.kind === 'expense' ? '−' : (e.kind === 'income' ? '+' : '⇄');
        return `
        <div class="entry-row">
          <div class="entry-main">
            <div class="entry-top">
              <span class="entry-tag">${e.category}</span>
              <span class="entry-method">${methodLabelOf(e)}</span>
            </div>
            <div class="entry-memo">${e.memo ? escapeHtml(e.memo) : ''}</div>
          </div>
          <span class="entry-amt ${e.kind}">${sign}${fmtYen(e.amount)}</span>
          <span class="entry-actions">
            <button data-edit="${e.id}" aria-label="編集">✎</button>
            <button data-del="${e.id}" aria-label="削除">×</button>
          </span>
        </div>`;
      }).join('');
      return `<div class="ledger">
        <div class="ledger-day">${d.getMonth()+1}月${d.getDate()}日（${weekday}）</div>
        ${rows}
      </div>`;
    }).join('<div style="height:10px"></div>');

    container.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => startEdit(b.dataset.edit)));
    container.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => deleteEntry(b.dataset.del)));
  }

  function renderHistory() {
    const catFilter = $('filterCategory').value;
    const methodFilter = $('filterMethod').value;

    let list;
    if (calMode) {
      list = calSelectedDate ? entries.filter(e => e.date === calSelectedDate) : [];
    } else {
      const period = $('filterPeriod').value;
      const now = new Date();
      const todayKey = todayStr();
      const curMonthKey = now.getFullYear()+'-'+pad(now.getMonth()+1);
      const lastMonthDate = new Date(now.getFullYear(), now.getMonth()-1, 1);
      const lastMonthKey = lastMonthDate.getFullYear()+'-'+pad(lastMonthDate.getMonth()+1);

      list = entries.slice();
      if (period === 'today') list = list.filter(e => e.date === todayKey);
      else if (period === 'month') list = list.filter(e => e.date.slice(0,7) === curMonthKey);
      else if (period === 'lastmonth') list = list.filter(e => e.date.slice(0,7) === lastMonthKey);
    }

    if (catFilter !== 'all') list = list.filter(e => e.category === catFilter);
    if (methodFilter !== 'all') list = list.filter(e => methodLabelOf(e) === methodFilter);

    if (calMode && !calSelectedDate) {
      $('historyContainer').innerHTML = '<div class="empty-state">カレンダーで日付をタップすると、その日の記録が表示されます。</div>';
      return;
    }
    renderEntryList(list);
  }

  populateFilterOptions();
  loadAll();
})();
</script>
